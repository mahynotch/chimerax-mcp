[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chimerax-mcp"
version = "0.1.0"
description = "MCP server that connects AI coding tools to UCSF ChimeraX for natural-language protein editing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Huaiyuan Ma", email = "mahynotch@users.noreply.github.com" },
]
keywords = [
    "chimerax",
    "mcp",
    "model-context-protocol",
    "molecular-visualization",
    "structural-biology",
    "protein",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "fastmcp>=0.4.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/mahynotch/chimerax-mcp"
Repository = "https://github.com/mahynotch/chimerax-mcp"
Issues = "https://github.com/mahynotch/chimerax-mcp/issues"
Documentation = "https://github.com/mahynotch/chimerax-mcp#readme"

[project.scripts]
chimerax-mcp = "chimerax_mcp.server:main"

[tool.setuptools.packages.find]
include = ["chimerax_mcp*"]
